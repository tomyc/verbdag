# Render Blueprint – statyczna strona (darmowa, serwowana z CDN Render)
services:
  - type: web
    name: verbdag
    runtime: static
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # pliki z hashem w nazwie można cache'ować na stałe
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html zawsze świeży, żeby nowa wersja docierała od razu
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
